<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa Lobos</title>
<link rel="preconnect" href="[https://fonts.googleapis.com/](https://fonts.googleapis.com/)">
<link href="[https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Fraunces:ital,wght@0,600;1,600&display=swap](https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Fraunces:ital,wght@0,600;1,600&display=swap)" rel="stylesheet">
<style>
  :root{
    --bg: #10161C;
    --bg-alt: #161E26;
    --card: #1B2530;
    --ink: #EDE7DA;
    --ink-dim: #9BA7AF;
    --line: #2B3641;
    --moon: #D9A94C;
    --clay: #C06A4C;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.6;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--moon);
  }
  h1, h2, h3{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    margin: 0;
  }
  a{ color: inherit; }

/* ---------- HERO ---------- */
.hero{
position: relative;
padding: 6rem 6vw 5rem;
overflow: hidden;
border-bottom: 1px solid var(--line);
text-align: center;
}
.hero-inner{
<img src="logo_lobos.jpg" alt="Logo Programa Lobos" class="logo-img">
max-width: 780px;
margin: 0 auto;
position: relative;
z-index: 2;
}
.hero h1{
font-size: clamp(2.6rem, 7vw, 4.6rem);
line-height: 0.98;
margin: 0.6rem 0 1.4rem;
}
.hero p.lede{
font-size: 1.15rem;
color: var(--ink-dim);
max-width: 560px;
margin: 0 auto;
}
.logo-img{
width: 150px;
height: auto;
margin-bottom: 1.5rem;
}

/* ---------- STAT BAR ---------- */
.stats{
display: grid;
grid-template-columns: repeat(3, 1fr);
border-bottom: 1px solid var(--line);
}
.stat{
padding: 2.2rem 2rem;
border-left: 1px solid var(--line);
}
.stat:first-child{ border-left: none; }
.stat .num{
font-family: 'Fraunces', serif;
font-size: 2.4rem;
color: var(--moon);
display:block;
}
.stat .lbl{
color: var(--ink-dim);
font-size: 0.9rem;
margin-top: 0.3rem;
}
@media (max-width: 700px){
.stats{ grid-template-columns: 1fr; }
.stat{ border-left:none; border-top: 1px solid var(--line); }
.stat:first-child{ border-top:none; }
}

/* ---------- SECTIONS ---------- */
section.block{
padding: 4.5rem 6vw;
max-width: 920px;
margin: 0 auto;
border-bottom: 1px solid var(--line);
}
section.block h2{
font-size: 1.9rem;
margin: 0.5rem 0 1.4rem;
}
section.block p{
color: var(--ink-dim);
max-width: 700px;
}
section.block p + p{ margin-top: 1rem; }

/* ---------- PATH DIAGRAM ---------- */
.path{
margin-top: 2.5rem;
display: flex;
flex-direction: column;
gap: 0;
}
.path-step{
display: grid;
grid-template-columns: 32px 1fr;
gap: 1.2rem;
position: relative;
padding-bottom: 2.2rem;
}
.path-step:last-child{ padding-bottom: 0; }
.path-dot{
width: 12px; height: 12px;
border-radius: 50%;
background: var(--moon);
margin-top: 6px;
position: relative;
z-index: 2;
}
.path-step.alt .path-dot{ background: var(--clay); }
.path-step:not(:last-child)::before{
content:'';
position:absolute;
left: 5px;
top: 18px;
bottom: -4px;
width: 2px;
background: var(--line);
}
.path-step h3{
font-family: 'IBM Plex Sans', sans-serif;
font-weight: 600;
font-size: 1.05rem;
color: var(--ink);
}
.path-step p{ margin-top: 0.35rem; font-size: 0.96rem; }

/* ---------- CARDS ---------- */
.cards{
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 1px;
background: var(--line);
margin-top: 2rem;
border: 1px solid var(--line);
}
.card{
background: var(--card);
padding: 1.6rem 1.7rem;
}
.card h3{
font-family: 'IBM Plex Mono', monospace;
font-size: 0.78rem;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--moon);
font-weight: 500;
margin-bottom: 0.6rem;
}
.card p{ color: var(--ink-dim); font-size: 0.95rem; margin: 0; }
@media (max-width: 700px){ .cards{ grid-template-columns: 1fr; } }

/* ---------- IMPACT ---------- */
.impact{
display: grid;
grid-template-columns: 1fr 1fr;
gap: 1px;
background: var(--line);
border: 1px solid var(--line);
margin-top: 2rem;
}
.impact div{
background: var(--bg-alt);
padding: 1.8rem;
}
.impact .eyebrow{ margin-bottom: 0.5rem; display:block; }
.impact p{ margin:0; color: var(--ink-dim); font-size: 0.95rem; }
@media (max-width: 700px){ .impact{ grid-template-columns: 1fr; } }

footer{
padding: 3rem 6vw 4rem;
color: var(--ink-dim);
font-size: 0.85rem;
max-width: 920px;
margin: 0 auto;
}
footer .eyebrow{ display:block; margin-bottom: 0.8rem; }

</body>
</html>
